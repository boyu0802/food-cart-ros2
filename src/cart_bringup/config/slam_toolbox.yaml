###############################################################################
# slam_toolbox online_async mapping config — team 6998 food cart
#
# All values below are reasonable starting points for a Slamtec C1 (~12 m,
# 10 Hz, 360°) on a slow indoor robot. Lines tagged "# PLACEHOLDER" are the
# ones most likely to need re-tuning once the real cart is moving.
###############################################################################

slam_toolbox:
  ros__parameters:

    # ----- frames & topics -----
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_map_saver: true
    mode: mapping                  # 'mapping' (online) or 'localization'

    # ----- general -----
    debug_logging: false
    throttle_scans: 1              # process every Nth scan
    transform_publish_period: 0.05 # 20 Hz map->odom
    map_update_interval: 1.0       # seconds between map publishes
    resolution: 0.05               # m/cell  # PLACEHOLDER (tune to env)
    max_laser_range: 12.0          # Slamtec C1 spec max
    minimum_time_interval: 0.2     # min seconds between processed scans
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000

    # ----- motion thresholds -----
    # The robot must move at least one of these between scans to be added.
    minimum_travel_distance: 0.2   # m   # PLACEHOLDER
    minimum_travel_heading: 0.2    # rad # PLACEHOLDER

    # ----- scan matcher / loop closure -----
    enable_interactive_mode: false
    use_scan_matching: true
    use_scan_barycenter: true
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ----- correlation / scan matcher tuning -----
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349   # rad (0.2 deg)
    coarse_search_angle_offset: 0.349   # rad (20 deg)
    coarse_angle_resolution: 0.0349     # rad (2 deg)
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
