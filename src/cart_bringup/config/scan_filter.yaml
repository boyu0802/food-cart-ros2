###############################################################################
# scan_sector_filter — masks the cart's corner-post sectors out of /scan_raw
# and republishes the clean scan on /scan (what slam_toolbox and BOTH Nav2
# costmaps consume). See scan_sector_filter.py for the why.
#
# Sectors are [lo, hi] degree pairs in the `laser` frame:
#   0 deg = +x (forward), CCW positive, wrapped to (-180, 180].
#   A pair with lo > hi wraps through +/-180 deg (e.g. [170, -170]).
#
# Measured on the real cart 2026-05-24 from /scan_raw (how-to at the bottom).
# The centered C1's scan plane cuts through the cart's own structure: the 4
# swerve modules (each a ~25 mm pillar pair + a chain loop) plus one asymmetric
# bracket. Each module shows as one short-range blob at ~0.3 m; the 8 pillars
# are NOT individually resolvable (the pillar pair on a module is cm apart ->
# only a few deg at 0.3 m -> they merge), and the thin chain strands fold into
# the same blobs. So we mask per-module blobs with a +/-3 deg margin.
#
# SAFETY: every masked sector is a direction the robot is blind to
# obstacles. The cart is holonomic (it can strafe any direction), so a
# blind sector is a real collision gap in ALL travel directions, not just
# "behind while driving forward." Keep each mask as NARROW as the post
# truly shadows. The forward D455 depth gives partial cover up front only.
###############################################################################
scan_sector_filter:
  ros__parameters:
    input_topic: /scan_raw
    output_topic: /scan
    # Flat lo,hi pairs in degrees. Measured 2026-05-24; closest ~0.28-0.35 m.
    mask_sectors_deg:
      # front-left swerve module (pillar pair + chain)
      - 63.7
      - 77.6
      # front-right swerve module (mirror)
      - -74.2
      - -59.7
      # rear-left swerve module: pillar blob + inboard chain strand, with a
      # ~2 deg see-through gap between them left UNMASKED on purpose
      - 105.1
      - 120.6
      - 95.1
      - 103.1
      # rear-right swerve module (mirror of rear-left)
      - -117.6
      - -99.6
      - -98.6
      - -91.1
      # asymmetric bracket, rear-right — no left-side twin; confirmed
      # cart-fixed by push-test 2026-05-24
      - -157.5
      - -147.5

###############################################################################
# HOW TO MEASURE THE REAL SECTORS
#   1. Park the cart, run the lidar, and view /scan_raw in rviz2 or foxglove
#      (frame `laser`, fixed frame `laser`).
#   2. The 4 posts show as constant short-range arcs at fixed bearings. For
#      each, read off the start and end angle of the arc.
#   3. rviz shows 0 deg along +x (forward), angles increasing CCW. Convert to
#      this file's range (-180, 180] and pad each side by ~2-3 deg of margin.
#   4. Replace the pairs above, rebuild cart_bringup, relaunch. The node logs
#      "X beams masked (Y% of FOV blind)" on the first scan — sanity-check Y.
#
# If you ever switch to a non-centered lidar or more/fewer posts, just edit
# the pair list; the node handles any even-length list and wrapping sectors.
###############################################################################
