###############################################################################
# Nav2 params — team 6998 food cart
#
# Holonomic swerve drive (vx, vy, omega independently).
# Lines tagged "# PLACEHOLDER" depend on the real robot footprint /
# top speed / hardware-confirmed acceleration limits.
###############################################################################

amcl:
  ros__parameters:
    use_sim_time: false
    # We map with slam_toolbox at runtime, so amcl is only used in
    # localization-only mode. Defaults here are reasonable.
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    laser_model_type: likelihood_field
    laser_max_range: 12.0
    laser_min_range: 0.1
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    set_initial_pose: false
    robot_model_type: nav2_amcl::DifferentialMotionModel
    transform_tolerance: 1.0
    update_min_a: 0.2
    update_min_d: 0.25
    scan_topic: scan
    tf_broadcast: true

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    # Use Nav2's bundled BTs by default: leave default_nav_to_pose_bt_xml /
    # default_nav_through_poses_bt_xml UNSET so bt_navigator falls back to its
    # built-in navigate_to_pose_w_replanning_and_recovery.xml.
    # WARNING: do NOT set these to '' (empty). Empty != "use default" -- it
    # means "load a file named <nothing>", which fails at startup with
    # "Couldn't open input XML file:" / "BT file not found: ." and every goal
    # is canceled before any path is planned (no /plan published).
    # To use a custom tree later, set these to its absolute .xml path.
    # NOTE: do NOT enumerate plugin_lib_names here. On Nav2 Jazzy the
    # bt_navigator already auto-registers every standard BT node. Re-listing
    # them (this used to hold the full default list) double-registers and
    # throws "ID [ComputePathToPose] already registered" -> FATAL -> SIGSEGV
    # on startup, which silently leaves the whole Nav2 lifecycle 'inactive'.
    # Only add plugin_lib_names back for CUSTOM BT nodes beyond the defaults.

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.05        # PLACEHOLDER
      yaw_goal_tolerance: 0.10       # PLACEHOLDER
      stateful: true

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.05
      batch_size: 2000
      ax_max: 1.0                    # PLACEHOLDER
      ax_min: -1.0                   # PLACEHOLDER
      ay_max: 1.0                    # PLACEHOLDER
      az_max: 2.0                    # PLACEHOLDER
      vx_std: 0.2
      vy_std: 0.2
      wz_std: 0.4
      vx_max: 3.0                    # PLACEHOLDER (top forward speed)
      vx_min: -3.0                  # PLACEHOLDER
      vy_max: 3.0                    # PLACEHOLDER (holonomic strafe)
      wz_max: 1.8                    # PLACEHOLDER
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.2
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"           # swerve = omni-directional
      visualize: false
      regenerate_noises: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      AckermannConstraints:
        min_turning_r: 0.2
      critics:
        - "ConstraintCritic"
        - "CostCritic"
        - "GoalCritic"
        - "GoalAngleCritic"
        - "PathAlignCritic"
        - "PathFollowCritic"
        - "PathAngleCritic"
        - "PreferForwardCritic"
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PreferForwardCritic:
        enabled: false               # holonomic: no front-only bias
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      CostCritic:
        enabled: true
        cost_power: 1
        # 3.81->2.0 (2026-05-28): stop braking for soft (non-lethal) inflated cost so the
        # cart drives at speed past obstacles instead of crawling. Hard safety is untouched
        # -- critical_cost 300 + collision_cost 1e6 + consider_footprint still hard-stop a
        # real footprint collision; this only relaxes the timid slow-down in the gray zone.
        cost_weight: 2.1
        critical_cost: 300.0
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.40
        trajectory_point_step: 2
      PathAlignCritic:
        enabled: true
        cost_power: 1
        # 14.0->8.0 (2026-05-28): 14 glued MPPI to the global line, so when it swung out to
        # pass an obstacle it got yanked back onto the path (into the obstacle) and stalled.
        # 8 lets it deviate FURTHER from the original path to clear the obstacle, then
        # re-converge. PathFollowCritic (5) still keeps it making forward progress.
        cost_weight: 5.0
        max_path_occupancy_ratio: 0.03
        trajectory_point_step: 4
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 6.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # 3->5 (2026-05-28): widened to a 5x5 m window (2.5 m radius) so MPPI has room to
      # actually follow a detour once the global planner produces one. PathAlignCritic
      # (weight 14) keeps MPPI hugging the global path; a 1.5 m window only let it nudge
      # around thin obstacles. Lidar raytrace_max_range (3.0) still covers the new window
      # edges. Cheap on the Pi5: 100x100 cells @ 0.05 res.
      width: 7
      height: 7
      resolution: 0.05
      # Footprint: real 0.725 m square, measured 2026-05-24 (axis-aligned at base_link)
      footprint: "[[0.3625, 0.3625], [0.3625, -0.3625], [-0.3625, -0.3625], [-0.3625, 0.3625]]"
      footprint_padding: 0.03
      plugins: ["voxel_layer", "denoise_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 3.0->5.0 (2026-05-28): steeper decay so inflated cost is concentrated right at
        # obstacles instead of smearing a soft "squishy" haze across the window. After the
        # window grew 3->5 m it now sees corridor side-walls that used to be out of view;
        # with the old soft gradient that filled the whole window with low-grade cost and
        # MPPI felt boxed-in -> jittered in place instead of committing. Crisp gradient
        # keeps the corridor CENTER cheap so the controller drives confidently.
        cost_scaling_factor: 5.0
        # Must be >= circumscribed radius (0.555 m = padded 0.725 m square's
        # corner reach: 0.3925*sqrt(2)). Below it, MPPI's SE2 CostCritic
        # (consider_footprint: true) loses the potential-field fast-path and
        # full-footprint-checks every trajectory sample -> slow planning warning.
        inflation_radius: 0.6
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0            # 1->0->0 (2026-05-27): REVERTED back to 0. mark_threshold filters in Z
                                     # (voxel COLUMN height): a cell marks only if >=(threshold+1) voxels stack
                                     # in its column. A flat 2D lidar return is only ever ONE voxel tall, so
                                     # threshold 1 silently BLINDED the lidar (scans visible, never marked).
                                     # The denoise_layer below (minimal_group_size 2, XY-plane) is the correct
                                     # filter for the camera's salt-and-pepper floor speckle -- it drops
                                     # isolated cells regardless of column height. Let it do that job instead.
        # lidar = 360deg plane (clears + marks); camera = D455 depth cloud,
        # MARKING-ONLY for off-plane obstacles the lidar plane misses. lidar
        # does all clearing (see camera block below).
        observation_sources: lidar camera
        lidar:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          # 0.0->0.45 (2026-05-28): the lidar sits in the swerve-module plane and
          # hits the robot's own structure at ~0.28 m (~13 deg L-of-front), marking
          # a lethal cell on base_link -> MPPI's footprint CostCritic sees a self-
          # collision and crawls. 0.45 m > the 0.3925 m padded half-footprint, so
          # self-returns are never marked. raytrace_min_range stays 0.0 (still clear).
          obstacle_min_range: 0.45
          # inf_is_valid (2026-05-28): no-return beams arrive as +inf (confirmed
          # 133/720 beams inf on /scan). Default false DROPS them, so open
          # directions cast NO clearing ray -- a phantom out in open space is
          # never raytraced clear and only vanishes when it scrolls out of the
          # rolling window. true converts each inf beam to a max-range clearing
          # ray (clamped to raytrace_max_range 3.0). NaN'd post sectors are
          # untouched by this (NaN != inf), so the blind spots stay blind.
          inf_is_valid: true
        # ---- D455 depth cloud: off-plane obstacles the lidar plane misses ----
        # MARKING + bounded CLEARING (2026-05-28): the camera must clear its OWN
        # marks. The lidar is a flat 2D plane, so its raytrace only clears voxels
        # at the lidar's Z slice -- it can NEVER reach camera marks up at
        # z=0.25..1.6 m. With clearing:false those off-plane marks were immortal,
        # only vanishing when they scrolled out of the rolling window. clearing
        # raytrace is capped at the 1.5 m window radius to limit the narrow
        # ~87deg FOV erasing obstacles seen off to the side. Confirm the cloud is
        # actually flowing first (arm64 pointcloud quirk -- see sensors.launch.py).
        camera:
          topic: /camera/camera/depth/color/points
          data_type: "PointCloud2"
          marking: true
          clearing: true
          raytrace_max_range: 1.5
          raytrace_min_range: 0.3
          # min_obstacle_height EXCLUDES the floor: camera is 0.674 m high,
          # pitched 10deg down, so the floor fills the lower frame from ~0.8 m
          # out. Without this filter the planner treats the floor as a wall.
          # PLACEHOLDER: drive empty floor, confirm no phantom obstacles, tune.
          min_obstacle_height: 0.25   # 0.20->0.25 (2026-05-27): lift floor filter above the noisy
                                      # grazing-angle floor band. Lidar plane covers low obstacles anyway.
          max_obstacle_height: 2.0
          obstacle_max_range: 1.5     # 2.5->1.5 (2026-05-27): the local window is only 1.5 m in
                                      # radius, so marking past it is wasted work AND pulls in the
                                      # noisiest far floor. Cap at the window radius.
          obstacle_min_range: 0.3     # PLACEHOLDER (D455 min depth)
      # Removes isolated/standalone marked cells (salt-and-pepper from lidar/camera
      # noise) before inflation. Runs AFTER voxel_layer, BEFORE inflation_layer.
      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2         # drop obstacle blobs smaller than 2 connected cells
        group_connectivity_type: 8    # 8-connected (diagonals count as neighbors)
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      resolution: 0.05
      track_unknown_space: true
      footprint: "[[0.3625, 0.3625], [0.3625, -0.3625], [-0.3625, -0.3625], [-0.3625, 0.3625]]"
      footprint_padding: 0.03
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      # obstacle_layer re-added 2026-05-28 (was removed 2026-05-27): without it the global
      # planner was blind to obstacles not in the saved map, so it kept drawing the path
      # straight through them and MPPI -- a path FOLLOWER, not a planner -- stalled against
      # something only the LOCAL costmap could see, then burned recovery behaviors and
      # failed the goal. Re-adding it lets the 1 Hz global replan REROUTE around new
      # obstacles. The 2026-05-27 removal was to kill "ghost" marks (a non-rolling full-map
      # costmap never scrolls, so any mark the robot didn't later raytrace straight through
      # -- a passer-by, scan spike, or phantom stamped during bad localization -- became
      # PERMANENT and blocked the planner forever). The block below is tuned to self-heal
      # those instead: inf_is_valid clears open directions, lidar-only avoids un-clearable
      # off-plane camera marks, and clearing range >= marking range so every mark CAN clear.
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        # combination_method 1 (Max): overlay live marks on top of the static-map walls,
        # keeping BOTH -- never let a transient clear erase a real mapped wall.
        combination_method: 1
        # lidar ONLY here. The camera marks off-plane obstacles (z=0.25..1.6 m), but this
        # is a flat 2D layer that clears by raytracing the lidar's single plane -- it could
        # NEVER raytrace a camera mark clear, so those marks would be immortal ghosts. The
        # camera stays local-costmap-only (the rolling window scrolls its marks away).
        observation_sources: lidar
        lidar:
          topic: /scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          # inf_is_valid: same fix as the local costmap. No-return beams arrive as +inf;
          # default false DROPS them so open directions cast no clearing ray -- and because
          # this costmap never scrolls, a phantom in open space would stay FOREVER. true
          # converts each inf beam into a max-range clearing ray (clamped to
          # raytrace_max_range), so open space self-clears every replan.
          inf_is_valid: true
          # 0.45 m: reject the lidar's returns off the robot's own swerve-module structure
          # (~0.28 m), same self-collision fix as the local costmap's lidar block.
          obstacle_min_range: 0.45
          # Only MARK out to 4 m -- where localization is still trustworthy; marking far-out
          # returns in the map frame during a localization wobble is exactly what stamped
          # ghosts before. CLEAR out to 5 m (>= the 4 m marking range) so every mark this
          # layer can place, it can also raytrace clear.
          obstacle_max_range: 4.0
          raytrace_min_range: 0.0
          raytrace_max_range: 5.0
        # NOTE: if a ghost still survives (bad raytrace geometry), the robust backstop is a
        # periodic ClearEntireCostmap / clear-around-robot service call on the global
        # costmap from the BT or a small timer node -- that's node/launch wiring, not config,
        # so it's intentionally left out here. Try this self-healing config in the building
        # first and only add the periodic clear if ghosts actually reappear.
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 3.0->2.0 (2026-05-28): gentler/broader gradient so the PLANNER prefers the center
        # of free space and bows the planned path AROUND obstacles with more clearance --
        # fixes the "path hugged the obstacle, MPPI swung out then got trapped between the
        # obstacle cost and PathAlign pulling it back" stall. Done via cost_scaling, NOT a
        # bigger inflation_radius on purpose: radius stays 0.6 because raising it would
        # demand ~1.5 m clearance and the elevator cab is only ~1.4 m -> a wider radius
        # could make cab entry unplannable. Broad gradient buys clearance without that risk.
        cost_scaling_factor: 2.0
        inflation_radius: 0.6         # >= circumscribed radius 0.555 m (see local_costmap note)
      always_send_full_costmap: true

map_server:
  ros__parameters:
    use_sim_time: false
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: false
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.5         # PLACEHOLDER
    min_rotational_vel: 0.2
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [3.0, 3.0, 2.0]    # PLACEHOLDER [vx, vy, wz]
    min_velocity: [-3.0, -3.0, -2.0]
    max_accel: [1.0, 1.0, 2.0]       # PLACEHOLDER
    max_decel: [-1.0, -1.0, -2.0]    # PLACEHOLDER
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
