###############################################################################
# Floor-detector parameters. One YAML, four detectors, fully swappable.
#
# Defaults are tuned for a 1.5 m/s elevator with ~3.5m floor spacing —
# adjust once we calibrate against the real elevator.
###############################################################################

floor_v1_apriltag:
  ros__parameters:
    tag_topic: /limelight/tag
    output_topic: /elevator/floor_v1_apriltag
    floor_tag_id_offset: 0      # tag 101 = floor 1, 102 = floor 2, ...
    min_area: 0.005
    full_conf_area: 0.05
    confidence_floor: 0.70
    confidence_ceil: 0.95

floor_v2_time:
  ros__parameters:
    imu_topic: /imu
    output_topic: /elevator/floor_v2_time
    starting_floor: 1
    elevator_speed_m_s: 1.1       # PLACEHOLDER — calibrate vs real elevator
    floor_height_m: 3.8           # PLACEHOLDER
    move_threshold_mss: 0.30
    start_samples: 10
    stop_samples: 100
    # Fallback stop if the decel pulse is too gentle to cross move_threshold
    # (seen on real 1-floor trips: decel peaked ~0.29 < 0.30 and v2 hung).
    # Must exceed the longest continuous cruise-quiet (~max_floors*floor_h/
    # speed); 15s clears a 4-floor trip in this 5-floor building.
    force_stop_samples: 1500
    publish_rate_hz: 5.0

floor_v3_accel:
  ros__parameters:
    imu_topic: /imu
    output_topic: /elevator/floor_v3_accel
    starting_floor: 1
    floor_height_m: 3.8
    move_threshold_mss: 0.30
    v_threshold_ms: 0.20             # retained for compat; stop no longer uses v_z
    start_samples: 10
    stop_samples: 100
    force_stop_samples: 1500         # fallback stop; see floor_v2_time note above
    bias_window_s: 5.0
    bias_var_thr_mss2: 0.01           # rolling-variance gate for stationarity
    bias_var_window_n: 25             # ~0.25 s @ 100 Hz IMU
    correction_topic: /elevator/floor_v3_accel/correction
    correction_max_floor_delta: 2     # reject corrections that jump >2 floors
    publish_rate_hz: 5.0

floor_v4_fusion:
  ros__parameters:
    v1_topic: /elevator/floor_v1_apriltag
    v2_topic: /elevator/floor_v2_time
    v3_topic: /elevator/floor_v3_accel
    output_topic: /elevator/floor
    correction_out_topic: /elevator/floor_v3_accel/correction
    tag_max_age_s: 1.5
    time_max_age_s: 5.0
    accel_max_age_s: 5.0
    publish_rate_hz: 5.0
    n_floors: 5                       # clamp candidates to [1, n_floors]
    starting_floor: 1                 # fallback ref for disagreement arbitration

fake_elevator_imu:

  ros__parameters:
    imu_topic: /imu
    publish_rate_hz: 100.0
    accel_mss: 1.0
    floor_height_m: 3.5
    pre_idle_s: 2.0
    inter_trip_idle_s: 3.0
    post_idle_s: 5.0
    noise_std_mss: 0.02
    bias_mss: 0.0
    scenario: "+3"
    loop: false

fake_tag_publisher:
  ros__parameters:
    tag_topic: /limelight/tag
    publish_rate_hz: 10.0
    scenario: "2:101:0.04; 8:103:0.05; 14:104:0.06"

###############################################################################
# Direction-detector parameters. Same shape as the floor stack.
# v1 = digit-tracking (PRIMARY). v2 = arrow optical flow (PLACEHOLDER fallback).
###############################################################################

direction_v1_digit:
  ros__parameters:
    image_topic: /image
    output_topic: /elevator/direction_v1_digit
    # template_dir resolves to the package share dir by default; override here
    # if you want to point at a different template set.
    min_score: 0.45
    min_margin: 0.05
    history_window_s: 5.0
    min_observations: 2
    confidence_idle: 0.75
    confidence_moving_base: 0.55
    confidence_moving_step: 0.10
    publish_rate_hz: 10.0

direction_v2_flow:
  ros__parameters:
    image_topic: /image
    output_topic: /elevator/direction_v2_flow
    roi_x: 0
    roi_y: 0
    roi_w: 320
    roi_h: 240
    flow_threshold_px: 0.5          # PLACEHOLDER (fallback, unused for now)
    smoothing_window: 5
    confidence_idle: 0.50
    confidence_moving: 0.85
    publish_rate_hz: 10.0

direction_v3_fusion:
  ros__parameters:
    v1_topic: /elevator/direction_v1_digit
    v2_topic: /elevator/direction_v2_flow
    output_topic: /elevator/direction
    max_age_s: 1.0
    publish_rate_hz: 10.0

fake_direction_image:
  ros__parameters:
    image_topic: /image
    publish_rate_hz: 30.0
    image_w: 320
    image_h: 240
    block_size_px: 20
    block_speed_px_per_frame: 4.0
    seconds_per_floor: 6.0
    idle_pause_s: 3.0
    scenario: "+2,p4,-2"
    loop: false

video_replay:
  ros__parameters:
    image_topic: /image
    frame_id: camera_color_optical_frame
    loop: true
    publish_rate_hz: 0.0   # 0 = use the file's native framerate

direction_debug_view:
  ros__parameters:
    image_topic: /image
    direction_topic: /elevator/direction_v1_digit
    window_name: "direction_v1_digit (debug)"
    history_len: 30
