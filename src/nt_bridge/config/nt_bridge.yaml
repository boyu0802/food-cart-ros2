nt_bridge:
  ros__parameters:
    # ===== NT4 client connection =====
    team_number: 6998
    # If non-empty, used instead of team_number (e.g. "10.69.98.2" or "roborio-6998-frc.local")
    server_address: ""
    nt_client_name: "orange_pi_nav"

    # ===== enable/disable each direction =====
    enable_cmd_vel_out: true
    enable_odom_in: true
    enable_imu_in: true
    enable_limelight_in: true     # Limelight AprilTag detections -> /limelight/tag
    enable_mission_io: true       # press-button + start/loaded/unloaded/press_done

    # ===== ROS2 topic names =====
    cmd_vel_topic: "/cmd_vel"
    cmd_vel_stamped: false        # set true if Nav2 publishes TwistStamped
    cmd_vel_max_age: 0.5          # secs without /cmd_vel before bridge sends zeros (safety)

    odom_topic: "/odom"
    imu_topic: "/imu"
    tag_topic: "/limelight/tag"   # cart_elevator_msgs/TagDetection

    # ===== NT table names (RoboRIO must match) =====
    nt_cmd_table: "Nav/cmd"       # publishes vx, vy, omega, heartbeat, timestamp
    nt_odom_table: "Robot/odom"   # subscribes x, y, theta, vx, vy, omega
    nt_imu_table: "Robot/imu"     # subscribes yaw, yaw_rate, accel_x, accel_y
    nt_limelight_table: "limelight"  # default Limelight table; "limelight-<name>" if renamed

    # ===== mission I/O =====
    # ROS topic -> NT string (the supervisor publishes button names like
    # "call_up" or "floor_4"; the RoboRIO consumes the latest value).
    press_button_topic: "/elevator/press_button"
    nt_press_button_key: "Pi/elevator/press_button"
    # Lift+pusher commands ("load" | "unload" | "stow"). Runs in
    # parallel with the press path on the Rio side — separate
    # mechanism, separate NT key.
    mission_cmd_topic: "/mission/cmd"
    nt_mission_cmd_key: "Pi/mission/cmd"
    # NT bool -> ROS Bool, edge-triggered (publish only on rising edge).
    press_done_topic: "/elevator/press_done"
    nt_press_done_key: "Robot/elevator/press_done"
    mission_start_topic: "/mission/start"
    nt_mission_start_key: "Robot/mission/start_pressed"
    mission_loaded_topic: "/mission/loaded"
    nt_mission_loaded_key: "Robot/mission/loaded"
    mission_unloaded_topic: "/mission/unloaded"
    nt_mission_unloaded_key: "Robot/mission/unloaded"
    # Hold-to-run dead-man: operator holds a controller button on the
    # Rio; supervisor only ticks while this is true. Level-triggered
    # (not edge): /mission/enable is republished as a latched Bool on
    # every change so late subscribers always see the current state.
    mission_enable_topic: "/mission/enable"
    nt_mission_enable_key: "Robot/mission/enable"
    # Restart button: edge-triggered like start/loaded. On a rising
    # edge the supervisor cancels in-flight work and returns to IDLE.
    mission_restart_topic: "/mission/restart"
    nt_mission_restart_key: "Robot/mission/restart_pressed"
    mission_in_rate_hz: 20.0      # NT poll rate; high enough to not miss FRC ~20ms pulses

    # ===== rates =====
    odom_publish_rate: 50.0       # Hz
    imu_publish_rate: 100.0       # Hz
    tag_publish_rate: 20.0        # Hz; Limelight runs ~90 FPS, downsampled here

    # ===== TF =====
    publish_odom_tf: true         # nt_bridge -> odom -> base_footprint
    # REP-105: odom connects to base_footprint (ground frame); the URDF then
    # supplies the static base_footprint -> base_link (4.2 cm). Using base_link
    # here would give base_link two parents and break the TF tree.
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    imu_frame_id: "imu_link"
    tag_frame_id: "limelight"     # frame_id stamped on TagDetection messages

    # ===== covariances (tune to actual sensors) =====
    yaw_variance: 0.01
    yaw_rate_variance: 0.001
    accel_xy_variance: 0.1
